<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#151515" />
		<meta property="og:title" content="Masidy" />
		<meta property="og:description" content="Build apps with AI - from idea to v1 with Masidy." />
		<meta property="og:image" content="/icon-512.png" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Masidy" />
		<meta name="twitter:image" content="/icon-512.png" />
		<link
			rel="preload"
			href="/fonts/DepartureMono-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://esm.sh https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' wss: ws: http: https:; frame-src 'self' http://*.localhost:* https://*;" />
		<title>Masidy</title>
		<meta name="description" content="Build apps with AI - from idea to v1 with Masidy." />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark' || stored === 'system'
							? stored
							: 'system';
					var resolved =
						theme === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: theme;
					document.documentElement.dataset.mode = resolved;
					document.documentElement.style.colorScheme = resolved;
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
